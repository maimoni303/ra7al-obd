name: Build iOS
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - run: brew install xcodegen && xcodegen generate
      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test -project RA7ALOBDProbe.xcodeproj -scheme RA7ALOBDProbe \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro Max' CODE_SIGNING_ALLOWED=NO | xcbeautify
      - name: Unsigned IPA
        run: |
          set -o pipefail
          xcodebuild build -project RA7ALOBDProbe.xcodeproj -scheme RA7ALOBDProbe -configuration Release \
            -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | xcbeautify
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/RA7ALOBDProbe.app Payload/
          zip -qry RA7AL-OBD-Probe-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: RA7AL-OBD-Probe-iOS, path: RA7AL-OBD-Probe-unsigned.ipa }
      - name: Publish release (versioned file name so no cached copy is reused)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          V=$(grep MARKETING_VERSION project.yml | head -1 | sed 's/[^0-9.]//g')
          F="RA7AL-OBD-Probe-v${V}.ipa"
          cp RA7AL-OBD-Probe-unsigned.ipa "$F"
          gh release delete latest -y --cleanup-tag || true
          gh release create latest "$F" -t "RA7AL OBD Probe v${V} (latest)" -n "Version ${V} — build ${GITHUB_SHA}"
