name: Build iOS
on:
  push: { branches: ['**'] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - run: brew install xcodegen && xcodegen generate
      - name: Unit + UI tests (simulator)
        run: |
          set -o pipefail
          xcodebuild test -project RA7ALOBD.xcodeproj -scheme RA7ALOBD \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro Max' -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | xcbeautify
      - name: Show compiler errors
        if: failure()
        run: grep -E "error:|Test Case .* failed|XCTAssert" test.log | sort -u | head -60 || true
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p shots
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path shots || true
          ls -la shots | head -50
      - name: Push screenshots to the ci-screenshots branch
        if: always()
        run: |
          [ -d shots ] && [ "$(ls shots | wc -l)" -gt 0 ] || exit 0
          cd shots
          git init -q -b ci-screenshots
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "screenshots ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots
      - name: Unsigned IPA (entitlements embedded ad-hoc for re-signing)
        run: |
          set -o pipefail
          xcodebuild build -project RA7ALOBD.xcodeproj -scheme RA7ALOBD -configuration Release \
            -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | xcbeautify
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/RA7ALOBD.app Payload/
          codesign -f -s - --entitlements Resources/RA7ALOBD.entitlements Payload/RA7ALOBD.app
          codesign -d --entitlements - Payload/RA7ALOBD.app || true
          zip -qry RA7AL-OBD-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: RA7AL-OBD-iOS, path: RA7AL-OBD-unsigned.ipa }
      - name: Publish release (main only, versioned file name)
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          V=$(grep MARKETING_VERSION project.yml | head -1 | sed 's/[^0-9.]//g')
          F="RA7AL-OBD-v${V}.ipa"
          cp RA7AL-OBD-unsigned.ipa "$F"
          gh release delete latest -y --cleanup-tag || true
          gh release create latest "$F" -t "RA7AL OBD v${V}" -n "Version ${V} — build ${GITHUB_SHA}"
