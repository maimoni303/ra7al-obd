name: RA7ALOBDProbe
options:
  bundleIdPrefix: com.ra7al
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  RA7ALOBDProbe:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: "RA7AL OBD فحص"
        CFBundleName: "RA7AL OBD Probe"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar, en]
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIBackgroundModes: [bluetooth-central]
        NSBluetoothAlwaysUsageDescription: "يتصل التطبيق بقطعة OBD في سيارتك عبر البلوتوث لقراءة بياناتها."
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ra7al.obd.probe
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
  RA7ALOBDProbeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: RA7ALOBDProbe
schemes:
  RA7ALOBDProbe:
    build:
      targets:
        RA7ALOBDProbe: all
        RA7ALOBDProbeTests: [test]
    test:
      targets:
        - RA7ALOBDProbeTests
